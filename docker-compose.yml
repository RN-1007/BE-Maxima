version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maxima_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomelomaxima}
      POSTGRES_DB: ${POSTGRES_DB:-be_maxima}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxima_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      BASE_URL: ${BASE_URL:-https://api.maximaa.tech}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:pomelomaxima@postgres:5432/be_maxima?schema=public}
      JWT_SECRET: ${JWT_SECRET:-maxima_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://ai.maximaa.tech/api/v1/predict}
      AI_CHAT_URL: ${AI_CHAT_URL:-https://ai.maximaa.tech/api/v1/chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    volumes:
      - uploads_data:/app/uploads
    command: sh -c "npx prisma db push && node prisma/seed.js && node src/server.js"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
